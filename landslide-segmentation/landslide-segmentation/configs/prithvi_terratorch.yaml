# Template for TerraTorch (verify keys against your installed terratorch version).
# Prithvi-EO-2.0 expects HLS bands: BLUE, GREEN, RED, NIR_NARROW (B8A), SWIR_1 (B11), SWIR_2 (B12).
# Run scripts/check_bands.py first: if B8A is missing from L4S, map B08 -> NIR_NARROW and document it.
seed_everything: 42
trainer:
  accelerator: auto
  max_epochs: 50
  precision: 16-mixed
  default_root_dir: outputs/prithvi
model:
  class_path: terratorch.tasks.SemanticSegmentationTask
  init_args:
    model_factory: EncoderDecoderFactory
    model_args:
      backbone: prithvi_eo_v2_300
      backbone_pretrained: true
      backbone_bands: [BLUE, GREEN, RED, NIR_NARROW, SWIR_1, SWIR_2]
      necks:
        - name: SelectIndices
          indices: [5, 11, 17, 23]
        - name: ReshapeTokensToImage
        - name: LearnedInterpolateToPyramidal
      decoder: UNetDecoder
      decoder_channels: [512, 256, 128, 64]
      num_classes: 2
    loss: dice
    freeze_backbone: false
    class_weights: [0.1, 0.9]
optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 0.0001
    weight_decay: 0.05
# Data: export L4S patches to 6-band GeoTIFF-like arrays with scripts/prepare_prithvi.py,
# then point a GenericNonGeoSegmentationDataModule at data/processed/prithvi/{train,val}.
